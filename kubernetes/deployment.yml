apiVersion: apps/v1
kind: Deployment
metadata:
  name: rajeshdemo
  labels:
    app: rajeshdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rajeshdemo
  template:
    metadata:
      labels:
        app: rajeshdemo
    spec:
      containers:
      - name: rajeshdemo
        image: adamtravis/wezvatechbackend:9
        ports:
        - containerPort: 8080